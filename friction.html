<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What If Friction Disappeared for 60 Seconds?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film: the question sits in the middle of the frame; captions a little larger with a soft shadow */
    #hud .story-title.big.center { top: calc(var(--u) * 770); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(6, 7, 10, 0.5), rgba(6, 7, 10, 0.22) 62%, rgba(6, 7, 10, 0)); }
    #hud .story-title.big.center .hero { font-size: calc(var(--u) * 92); }
    #hud .story-caption { font-size: calc(var(--u) * 56);
      text-shadow: 0 0 calc(var(--u) * 16) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0, 0, 0, 0.8); }
    /* a HUD that reads on a phone: bigger label and number, a dark halo behind both */
    #hud .story-readout { left: calc(var(--u) * 58); }
    #hud .story-readout .label { font-size: calc(var(--u) * 38); letter-spacing: 0.14em; opacity: 0.95; color: #ffffff;
      text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, 0.8); }
    #hud .story-readout .value { font-size: calc(var(--u) * 104); margin-top: calc(var(--u) * 4);
      text-shadow: 0 0 calc(var(--u) * 18) rgba(0, 0, 0, 0.75), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0, 0, 0, 0.7); }
    #hud .story-readout .sub { font-family: var(--hud-font); font-size: calc(var(--u) * 28); letter-spacing: 0.08em; opacity: 0.95; margin-top: calc(var(--u) * 6);
      text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    #hud .story-readout .ctx { font-size: calc(var(--u) * 30); letter-spacing: 0.16em; opacity: 0.9; color: #ffd9a8; margin-top: calc(var(--u) * 12);
      text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    /* captions low in the frame with a soft scrim, clear of the action */
    #hud .story-caption { top: calc(var(--u) * 1400); padding: calc(var(--u) * 10) calc(var(--u) * 26); border-radius: calc(var(--u) * 18);
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0)); }
    /* the montage label and the 3 · 2 · 1 */
    #hud .fr-chyron { position: absolute; left: 50%; top: calc(var(--u) * 330); transform: translateX(-50%); text-align: center; width: calc(var(--u) * 900); }
    #hud .fr-chyron .mw { display: block; font-family: var(--hud-font); font-size: calc(var(--u) * 28); letter-spacing: 0.4em; opacity: 0.85; }
    #hud .fr-chyron .mt { display: block; font-family: var(--book); font-size: calc(var(--u) * 78); font-weight: 600; letter-spacing: 0.04em; margin-top: calc(var(--u) * 6);
      text-shadow: 0 0 calc(var(--u) * 20) rgba(0, 0, 0, 0.8); }
    #hud .fr-count { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-family: var(--book); font-weight: 600;
      font-size: calc(var(--u) * 420); line-height: 1; color: #ffffff; text-shadow: 0 0 calc(var(--u) * 40) rgba(0, 0, 0, 0.7); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <!-- Cinematic HUD (built by js/ui/storyHud.js from SCRIPT.hud; stays visible in Recording Mode) -->
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What if friction disappeared for 60 seconds?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">SIMULATING A WORLD WITHOUT FRICTION…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/camera/viewerHands.js"></script>
  <script src="js/world/people.js"></script>
  <script src="js/world/vehicles.js"></script>
  <script src="js/world/environment.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film (shot plan: films/friction/PLAN.md): the physics first, then the script, then the world -->
  <script src="films/friction/slide.js"></script>
  <script src="films/friction/scenario.js"></script>
  <script src="films/friction/script.js"></script>
  <script src="films/friction/city.js"></script>
  <script src="films/friction/traffic.js"></script>
  <script src="films/friction/props.js"></script>
  <script src="films/friction/cast.js"></script>
  <script src="films/friction/montage.js"></script>
  <script src="films/friction/audio.js"></script>
  <script src="films/friction/film.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
