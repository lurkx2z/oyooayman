  <style>
    /* this film's HUD (page-level only). 16:9 (1920×1080): --u = one design pixel of a 1920-wide frame (set by film.js) */
    #hud::before { height: 26%; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0)); }
    #hud .story-title.big.center { top: calc(var(--u) * 330); width: calc(var(--u) * 1400); margin-left: calc(var(--u) * -700); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(2, 3, 6, 0.5), rgba(2, 3, 6, 0.2) 62%, rgba(2, 3, 6, 0)); }
    #hud .story-title.big.center .kick { font-family: var(--book); font-size: calc(var(--u) * 54); font-weight: 600; letter-spacing: 0.06em; }
    #hud .story-title.big.center .hero { font-family: var(--book); font-size: calc(var(--u) * 124); font-weight: 700; line-height: 1.02; letter-spacing: 0.02em; }
    #hud .story-title.big.center .kick.k2 { margin-top: calc(var(--u) * 6); font-size: calc(var(--u) * 58); color: #ffcf8a; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 30) rgba(0, 0, 0, 0.8), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* the caption: one line, low, on a soft shadow (no plate); numbers amber; the closing question larger */
    .sb-cap { position: absolute; left: 50%; bottom: calc(var(--u) * 92); transform: translateX(-50%); width: max-content; max-width: calc(var(--u) * 1500); text-align: center; text-wrap: balance;
      font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 52); line-height: 1.2; color: #f6f1e7; pointer-events: none;
      text-shadow: 0 0 calc(var(--u) * 18) rgba(0, 0, 0, 0.85), 0 0 calc(var(--u) * 4) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 2) calc(var(--u) * 10) rgba(0, 0, 0, 0.7); }
    .sb-cap::before { content: ''; position: absolute; left: -14%; right: -14%; top: -55%; bottom: -55%; z-index: -1;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.56), rgba(0, 0, 0, 0)); }
    .sb-cap .n { color: #ffcf8a; }
    .sb-cap.q { bottom: calc(var(--u) * 430); font-size: calc(var(--u) * 82); font-weight: 600; max-width: calc(var(--u) * 1600); }
    /* the counter (top left, on a soft plate) and the scene's context line under it */
    .sb-ro, .sb-where { position: absolute; top: calc(var(--u) * 44); pointer-events: none; text-shadow: 0 0 calc(var(--u) * 14) rgba(0, 0, 0, 0.75), 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, 0.6); }
    .sb-ro { left: calc(var(--u) * 52); padding: calc(var(--u) * 16) calc(var(--u) * 26) calc(var(--u) * 18); border-radius: calc(var(--u) * 16); background: rgba(6, 8, 12, 0.55); }
    .sb-ro .l, .sb-where .l { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 26); letter-spacing: 0.18em; color: #ffffff; opacity: 0.92; }
    .sb-ro .v { font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 78); line-height: 1.05; margin-top: calc(var(--u) * 4); color: var(--paper);
      font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
    .sb-ro .s { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 26); letter-spacing: 0.1em; margin-top: calc(var(--u) * 6); color: #ffd7a8; white-space: nowrap; }
    .sb-ro .nx { color: #f6efe2; opacity: 0.9; font-size: calc(var(--u) * 25); letter-spacing: 0.12em; }
    .sb-ro .ow { color: #ff9b86; }
    .sb-ro .ow b { color: #ffb4a4; }
    .sb-ro .ow:empty { display: none; }
    .sb-ro .nx:empty { display: none; }
    .sb-ctx { position: absolute; left: calc(var(--u) * 52); top: calc(var(--u) * 312); pointer-events: none; padding: calc(var(--u) * 12) calc(var(--u) * 26) calc(var(--u) * 14); border-radius: calc(var(--u) * 14);
      background: rgba(6, 8, 12, 0.78); text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.7); }
    .sb-ctx .l { display: block; font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 24); letter-spacing: 0.16em; color: #fff; opacity: 0.8; }
    .sb-ctx .v { display: block; font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 40); margin-top: calc(var(--u) * 2); color: #ffd7a8; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
    .sb-ctx .v2 { display: block; font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 26); letter-spacing: 0.1em; margin-top: calc(var(--u) * 6); color: #f6efe2; white-space: nowrap; }
    .sb-ctx .v2:empty { display: none; }
    .sb-ctx .chip { display: inline-block; margin-right: calc(var(--u) * 18); opacity: 0.38; }
    .sb-ctx .chip.on { opacity: 1; color: #ffcf8a; }
    .sb-ctx .chip.hit { opacity: 1; color: #fff; text-shadow: 0 0 calc(var(--u) * 16) rgba(255, 220, 160, 0.95); }
    .sb-ctx .dim { opacity: 0.55; }
    /* the honest label (bottom left, under the caption line) */
    .sb-tag { position: absolute; left: calc(var(--u) * 52); bottom: calc(var(--u) * 22); font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 28); letter-spacing: 0.12em;

    /* where you are (top right) and the gravity there */
    .sb-where { right: calc(var(--u) * 60); text-align: right; }
    .sb-where .v { font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 46); line-height: 1.05; margin-top: calc(var(--u) * 6); color: var(--paper); font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
    .sb-where .f { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 26); letter-spacing: 0.1em; margin-top: calc(var(--u) * 8); color: #ffd7a8; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sb-where .f:empty { display: none; }
    .sb-where sup, .sb-ro sup { font-size: 0.6em; }
    .sb-ctx sup { font-size: 0.6em; }
    /* the readout's money line: the cents tick; a purchase or a gift slides out under it */
    .sb-ro .dl { font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 28); letter-spacing: 0.08em; margin-top: calc(var(--u) * 4); white-space: nowrap; color: #ff9b86; }
    .sb-ro .dl.give { color: #9fe0b0; }
    .sb-ro .dl:empty { display: none; }
    .sb-ro .s b { color: #fff; font-weight: 700; }
    /* the camera glasses (downtown): REC, and where your eyes are (a ring) */
    .sb-rec { position: absolute; right: calc(var(--u) * 60); bottom: calc(var(--u) * 40); font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 24); letter-spacing: 0.18em; color: #fff; pointer-events: none; }
    .sb-rec::before { content: ''; display: inline-block; width: calc(var(--u) * 16); height: calc(var(--u) * 16); border-radius: 50%; background: #ff3b30; margin-right: calc(var(--u) * 10); vertical-align: 0; }
    .sb-gaze { position: absolute; width: calc(var(--u) * 86); height: calc(var(--u) * 86); margin: calc(var(--u) * -43) 0 0 calc(var(--u) * -43); border-radius: 50%; pointer-events: none;

    .sb-gaze::after { content: ''; position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 10); height: calc(var(--u) * 10); margin: calc(var(--u) * -5); border-radius: 50%; background: rgba(255, 220, 140, 0.95); }
    .sb-gaze .t { position: absolute; left: calc(var(--u) * 100); top: 50%; transform: translateY(-50%); white-space: nowrap; font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 26); letter-spacing: 0.12em; color: #ffe2a8;
      text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    /* the diagrams (illustrations): right of centre, or large in the middle of the frame */
    .sb-inset { position: absolute; right: calc(var(--u) * 60); top: calc(var(--u) * 318); width: calc(var(--u) * 792); height: calc(var(--u) * 490); pointer-events: none; }
    /* (every panel ends 800 px down: clear of a two-line caption, which starts about 860) */
    .sb-inset.mid { top: calc(var(--u) * 222); width: calc(var(--u) * 937); height: calc(var(--u) * 580); }
    .sb-inset.big { right: auto; left: 50%; margin-left: calc(var(--u) * -560); top: calc(var(--u) * 108); width: calc(var(--u) * 1120); height: calc(var(--u) * 693); }
    .sb-inset svg { width: 100%; height: 100%; display: block; }
    .sb-inset .t { font-family: var(--hud-font); font-weight: 700; font-size: 27px; letter-spacing: 0.1em; fill: #f6efe2; }
    .sb-inset .s { font-family: var(--hud-font); font-weight: 600; font-size: 23px; letter-spacing: 0.1em; fill: #ffd7a8; }
    .sb-inset .b { font-family: var(--hud-font); font-weight: 600; font-size: 24px; fill: #fff; }
    .sb-inset .eq { font-family: var(--book); font-weight: 500; font-size: 46px; fill: #f6efe2; }
    .sb-inset .eq.big { font-size: 64px; fill: #ffcf8a; }
    /* labels pinned to places */
    .sb-lab { position: absolute; transform: translate(calc(var(--u) * -14), -50%); pointer-events: none; white-space: nowrap; font-family: var(--hud-font); font-weight: 600;

    /* (the plate sits behind the words only: the ring stays clear, so you see the thing it points at inside it) */
    .sb-lab .t { display: inline-block; vertical-align: middle; padding: calc(var(--u) * 6) calc(var(--u) * 14); border-radius: calc(var(--u) * 10); background: rgba(4, 6, 10, 0.55); }
    .sb-lab small { display: block; font-size: 0.75em; opacity: 0.9; color: #ffd7a8; }
    .sb-lab .d { display: inline-block; width: calc(var(--u) * 28); height: calc(var(--u) * 28); border-radius: 50%; margin-right: calc(var(--u) * 8);
      box-shadow: 0 0 0 calc(var(--u) * 2.5) rgba(255, 215, 168, 0.85); vertical-align: middle; }
    /* near the right edge the words go on the left of the ring */
    .sb-lab.r { display: flex; flex-direction: row-reverse; align-items: center; text-align: right; transform: translate(calc(-100% + var(--u) * 14), -50%); }
    .sb-lab.r .d { margin-right: 0; margin-left: calc(var(--u) * 8); }
