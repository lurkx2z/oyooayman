<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What If the Moon Crashed Into Earth?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film: the question in the middle of the frame, under the Moon */
    #hud .story-title.big.center { top: calc(var(--u) * 930); width: calc(var(--u) * 1040); margin-left: calc(var(--u) * -520); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(3, 5, 10, 0.55), rgba(3, 5, 10, 0.22) 62%, rgba(3, 5, 10, 0)); }
    #hud .story-title.big.center .hero { font-size: calc(var(--u) * 84); font-weight: 700; line-height: 1.08; letter-spacing: 0.01em; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 26) rgba(0, 0, 0, 0.8), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.75); }
    /* captions: small, low, on a soft scrim */
    #hud .story-caption { top: calc(var(--u) * 1360); font-size: calc(var(--u) * 50); font-weight: 600; padding: calc(var(--u) * 14) calc(var(--u) * 30); border-radius: calc(var(--u) * 18);
      background: rgba(4, 6, 10, 0.45); text-shadow: 0 0 calc(var(--u) * 16) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0, 0, 0, 0.8); }
    /* the HUD: minimal, top left */
    #hud .story-readout { left: calc(var(--u) * 40); padding: calc(var(--u) * 14) calc(var(--u) * 24); border-radius: calc(var(--u) * 20); background: rgba(4, 6, 12, 0.36); }
    #hud .story-readout .label { font-size: calc(var(--u) * 34); letter-spacing: 0.16em; opacity: 0.95; color: #ffffff; text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    #hud .story-readout .value { font-size: calc(var(--u) * 92); margin-top: calc(var(--u) * 4); text-shadow: 0 0 calc(var(--u) * 18) rgba(0, 0, 0, 0.75); }
    #hud .story-readout .sub { font-family: var(--hud-font); font-size: calc(var(--u) * 32); letter-spacing: 0.1em; opacity: 0.95; margin-top: calc(var(--u) * 6); color: #ffcf9a; text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    /* 24 HOURS EARLIER */
    #hud .mn-rewind { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--book); font-weight: 600;
      font-size: calc(var(--u) * 78); letter-spacing: 0.08em; color: #fff; text-shadow: 0 0 calc(var(--u) * 30) rgba(0, 0, 0, 0.85); }
    /* the end card, on black */
    #hud .mn-end { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: calc(var(--u) * 960); text-align: center; color: #fff; }
    #hud .mn-end .a { font-family: var(--book); font-weight: 700; font-size: calc(var(--u) * 56); line-height: 1.18; letter-spacing: 0.02em; }
    #hud .mn-end .b { font-family: var(--hud-font); font-size: calc(var(--u) * 28); letter-spacing: 0.16em; opacity: 0.8; margin-top: calc(var(--u) * 46); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <!-- Cinematic HUD (built by js/ui/storyHud.js from SCRIPT.hud; stays visible in Recording Mode) -->
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What if the Moon crashed into Earth?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BUILDING THE MOON…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/camera/viewerHands.js"></script>
  <script src="js/world/people.js"></script>
  <script src="js/world/vehicles.js"></script>
  <script src="js/world/environment.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film (shot plan: films/moon/PLAN.md): the story clock first, then the Moon, the world, the sea, the people -->
  <script src="films/moon/script.js"></script>
  <script src="films/moon/moon.js"></script>
  <script src="js/fx/mirror.js"></script>
  <script src="films/moon/city.js"></script>
  <script src="films/moon/water.js"></script>
  <script src="films/moon/cast.js"></script>
  <script src="films/moon/world.js"></script>
  <script src="films/moon/fx.js"></script>
  <script src="films/moon/audio.js"></script>
  <script src="films/moon/film.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
