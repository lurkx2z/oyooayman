<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What if Africa suddenly disappeared?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film's HUD (page-level only) */
    #hud .story-title.big.center { top: calc(var(--u) * 700); width: calc(var(--u) * 1000); margin-left: calc(var(--u) * -500); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(2, 3, 6, 0.55), rgba(2, 3, 6, 0.22) 62%, rgba(2, 3, 6, 0)); }
    #hud .story-title.big.center .kick { font-family: var(--book); font-size: calc(var(--u) * 62); font-weight: 600; letter-spacing: 0.05em; }
    #hud .story-title.big.center .hero { font-family: var(--book); font-size: calc(var(--u) * 108); font-weight: 700; line-height: 1.04; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 30) rgba(0, 0, 0, 0.8), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* the narration, word-timed: one short line on a dark plate, inside the safe zone */
    .af-sub { position: absolute; top: calc(var(--u) * 1330); left: 46%; transform: translateX(-50%); font-family: var(--book); font-size: calc(var(--u) * 56); font-weight: 600;
      line-height: 1.2; color: #f4eee4; padding: calc(var(--u) * 14) calc(var(--u) * 30); border-radius: calc(var(--u) * 14); background: rgba(4, 6, 9, 0.6);
      max-width: calc(var(--u) * 800); width: max-content; text-align: center; text-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 8) rgba(0, 0, 0, 0.6); pointer-events: none; }
    .af-sub span { transition: none; }
    /* the top-left readout */
    .af-ro { position: absolute; left: calc(var(--u) * 48); top: calc(var(--u) * 230); padding: calc(var(--u) * 16) calc(var(--u) * 26); border-radius: calc(var(--u) * 14);
      background: rgba(4, 6, 10, 0.45); pointer-events: none; max-width: calc(var(--u) * 820); }
    .af-ro .l { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 28); letter-spacing: 0.16em; color: #ffffff; opacity: 0.92; }
    .af-ro .v { font-family: var(--book); font-size: calc(var(--u) * 92); line-height: 1.05; margin-top: calc(var(--u) * 6); color: var(--paper); font-variant-numeric: lining-nums tabular-nums; }
    .af-ro .s { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 26); letter-spacing: 0.12em; margin-top: calc(var(--u) * 8); color: #ffd7a8; }
    /* the time tag: top right of the safe area */
    .af-tag { position: absolute; left: calc(var(--u) * 48); top: calc(var(--u) * 168); font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.2em; font-size: calc(var(--u) * 27);
      color: #f3ead8; padding: calc(var(--u) * 10) calc(var(--u) * 20); border-radius: calc(var(--u) * 10); background: rgba(6, 8, 12, 0.55); pointer-events: none; }
    /* labels pinned to places */
    .af-lab { position: absolute; transform: translate(calc(var(--u) * -16), -50%); pointer-events: none; white-space: nowrap; font-family: var(--hud-font); font-weight: 600;
      font-size: calc(var(--u) * 30); letter-spacing: 0.1em; color: #f6efe2; text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, 0.9); }
    .af-lab small { display: block; margin-left: calc(var(--u) * 34); font-size: 0.78em; opacity: 0.85; color: #ffd7a8; }
    .af-lab .d { display: inline-block; width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: 50%; margin-right: calc(var(--u) * 16);
      box-shadow: 0 0 0 calc(var(--u) * 3) rgba(255, 215, 168, 0.9); vertical-align: middle; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
    </div>
  </div>
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What if Africa suddenly disappeared?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BUILDING THE PLANET…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine (unchanged; this film only configures and extends it from its own folder) -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script>installFog({ bankScale: 0.012, bankAmount: 0.4, lowHeight: 6, lowAmount: 0.5, cap: 0.9 });</script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/camera/cameraController.js"></script>

  <script src="js/world/earth.js"></script>

</body>
