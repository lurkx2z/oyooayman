<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What If Gravity Doubled? Episode 01: The Day Everything Became Heavy</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this prototype is 16:9 (1920×1080). --u = one design pixel of a 1920-wide frame (set by film.js). Page-level only. */
    #hud::before { height: 26%; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0)); }
    /* V3: the title sits left of centre, clear of his face (he is right of centre in S2) */
    #hud .story-title.big.center { top: calc(var(--u) * 300); width: calc(var(--u) * 900); margin-left: calc(var(--u) * -450); left: 29%; }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(10, 6, 18, 0.5), rgba(10, 6, 18, 0.2) 62%, rgba(10, 6, 18, 0)); }
    #hud .story-title.big.center .kick { font-family: var(--book); font-size: calc(var(--u) * 52); font-weight: 600; letter-spacing: 0.06em; }
    #hud .story-title.big.center .hero { font-family: var(--book); font-size: calc(var(--u) * 118); font-weight: 700; line-height: 1.04; color: #ffd9a8; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 30) rgba(20, 8, 30, 0.8), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* captions: one short line, bottom centre, soft plate; inside the central 9:16 column when short */
    #hud .story-caption { top: auto; bottom: calc(var(--u) * 92); left: 50%; transform: translateX(-50%); font-family: var(--book); font-size: calc(var(--u) * 50); font-weight: 600; line-height: 1.2;
      padding: calc(var(--u) * 12) calc(var(--u) * 30); border-radius: calc(var(--u) * 12); background: rgba(14, 8, 22, 0.55); max-width: calc(var(--u) * 1300); width: max-content; text-align: center; }
    /* V4: the end line sits left of centre; the balloon race climbs on the right */
    #hud .story-end { top: calc(var(--u) * 470); font-size: calc(var(--u) * 60); width: calc(var(--u) * 900); left: 29%; margin-left: calc(var(--u) * -450); transform: none; }
    /* the gravity gauge (film.js builds it): top-left label → dial + big serif number → small line */
    .gb-gauge { position: absolute; left: calc(var(--u) * 64); top: calc(var(--u) * 60); display: flex; align-items: center; gap: calc(var(--u) * 22);
      padding: calc(var(--u) * 16) calc(var(--u) * 30) calc(var(--u) * 16) calc(var(--u) * 20); border-radius: calc(var(--u) * 18); background: rgba(14, 8, 24, 0.42); opacity: 0; }
    .gb-gauge svg { width: calc(var(--u) * 150); height: calc(var(--u) * 150); display: block; }
    .gb-gauge .lab { font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.2em; font-size: calc(var(--u) * 24); color: #f1e6d6; opacity: 0.92; }
    .gb-gauge .val { font-family: var(--book); font-size: calc(var(--u) * 84); line-height: 1; margin-top: calc(var(--u) * 6); color: #fff1dc; font-variant-numeric: tabular-nums; }
    .gb-gauge .val small { font-size: 0.55em; margin-left: 0.12em; opacity: 0.9; }
    .gb-gauge .sub { font-family: var(--hud-font); font-weight: 500; letter-spacing: 0.1em; font-size: calc(var(--u) * 28); color: #ffc98a; margin-top: calc(var(--u) * 10); min-height: 1em; }
    /* POV eyelids (the transition into the character's eyes) */
    .gb-lid { position: absolute; left: -5%; width: 110%; height: 60%; background: #120d18; pointer-events: none; }
    .gb-lid.top { top: 0; border-radius: 0 0 50% 50% / 0 0 22% 22%; }
    .gb-lid.bot { bottom: 0; border-radius: 50% 50% 0 0 / 22% 22% 0 0; }
    /* ghost label in the close-up and the old-height label in the wide */
    .gb-tag { position: absolute; font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.14em; font-size: calc(var(--u) * 36); color: #f6ead8; opacity: 0;
      padding: calc(var(--u) * 8) calc(var(--u) * 18); border-radius: calc(var(--u) * 10); background: rgba(14, 8, 24, 0.7); white-space: nowrap; transform: translate(-50%, -50%); }
    .gb-tag b { font-family: var(--book); font-weight: 600; letter-spacing: 0; font-size: 1.35em; color: #ffd9a8; margin-left: 0.25em; }
    /* narration subtitles (film.js builds one per phrase): bottom centre, one or two lines, word-timed from the real audio */
    .gn-sub { position: absolute; bottom: calc(var(--u) * 84); left: 50%; transform: translateX(-50%); font-family: var(--book); font-size: calc(var(--u) * 48); font-weight: 600; line-height: 1.22;
      color: #fff4e4; padding: calc(var(--u) * 12) calc(var(--u) * 30); border-radius: calc(var(--u) * 12); background: rgba(14, 8, 22, 0.55); max-width: calc(var(--u) * 1380); width: max-content; text-align: center;
      text-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 8) rgba(0, 0, 0, 0.6); pointer-events: none; }
    .gn-sub span { transition: none; }
    /* the opening line is the title: big serif, left of centre, clear of the cup */
    .gn-sub.gn-title { bottom: auto; top: calc(var(--u) * 400); left: 24%; font-size: calc(var(--u) * 86); font-weight: 700; line-height: 1.08; color: #ffd9a8; width: calc(var(--u) * 790);
      background: radial-gradient(closest-side, rgba(10, 6, 18, 0.5), rgba(10, 6, 18, 0.2) 62%, rgba(10, 6, 18, 0)); padding: calc(var(--u) * 40) calc(var(--u) * 40);
      text-shadow: 0 0 calc(var(--u) * 30) rgba(20, 8, 30, 0.8), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* the drop experiment: lane labels above the boards, live timers under them, the replay tag */
    .gb-lane { position: absolute; transform: translate(-100%, -50%); text-align: center; pointer-events: none; padding: calc(var(--u) * 8) calc(var(--u) * 22); border-radius: calc(var(--u) * 12); background: rgba(14, 8, 24, 0.5); }
    .gb-lane .g { font-family: var(--book); font-size: calc(var(--u) * 62); font-weight: 700; line-height: 1; color: #fff1dc; }
    .gb-lane .n { font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.16em; font-size: calc(var(--u) * 28); color: #f1e6d6; opacity: 0.9; margin-top: calc(var(--u) * 6); }
    .gb-lane .p { font-family: var(--book); font-size: calc(var(--u) * 36); font-weight: 600; color: #ffc98a; margin-top: calc(var(--u) * 4); font-variant-numeric: tabular-nums; }
    .gb-lane.on { box-shadow: 0 0 0 calc(var(--u) * 2) rgba(255, 201, 138, 0.75); }
    .gb-timer { position: absolute; transform: translate(-100%, -50%); font-family: var(--book); font-size: calc(var(--u) * 56); font-weight: 600; color: #fff1dc; font-variant-numeric: tabular-nums;
      padding: calc(var(--u) * 4) calc(var(--u) * 20); border-radius: calc(var(--u) * 10); background: rgba(14, 8, 24, 0.55); pointer-events: none; white-space: nowrap; }
    .gb-lane.r, .gb-timer.r { transform: translate(0, -50%); }
    .gb-timer small { font-size: 0.6em; opacity: 0.85; }
    .gb-timer.done { color: #ffc98a; box-shadow: 0 0 0 calc(var(--u) * 2) rgba(255, 201, 138, 0.7); }
    .gb-replay { position: absolute; top: calc(var(--u) * 64); right: calc(var(--u) * 70); font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.2em; font-size: calc(var(--u) * 32); color: #f6ead8;
      padding: calc(var(--u) * 10) calc(var(--u) * 20); border-radius: calc(var(--u) * 10); background: rgba(14, 8, 24, 0.5); pointer-events: none; }
    .gb-replay::before { content: ''; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: #ff8a6b; margin-right: 0.7em; vertical-align: 0.05em; }
    /* ?safe: the central 9:16 column (for the future vertical cut) */
    .gb-safe { position: absolute; top: 0; bottom: 0; left: 50%; width: 31.64%; transform: translateX(-50%); border-left: 2px dashed rgba(120, 255, 200, 0.7); border-right: 2px dashed rgba(120, 255, 200, 0.7); pointer-events: none; display: none; }
    body.gb-showsafe .gb-safe { display: block; }
    /* 3-minute film: the episode card, the hologram labels, the measured results */
    .gb-ep { position: absolute; left: 24%; top: calc(var(--u) * 790); transform: translateX(-50%); text-align: center; pointer-events: none; width: calc(var(--u) * 790); }
    .gb-ep .k { font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.3em; font-size: calc(var(--u) * 24); color: #f1e6d6; opacity: 0.85; }
    .gb-ep .t { font-family: var(--book); font-style: italic; font-size: calc(var(--u) * 40); color: #fff1dc; margin-top: calc(var(--u) * 8); text-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 10) rgba(0, 0, 0, 0.7); }
    .gb-holo { position: absolute; transform: translate(-50%, -50%); pointer-events: none; padding: calc(var(--u) * 10) calc(var(--u) * 22); border-radius: calc(var(--u) * 12);
      background: rgba(8, 18, 34, 0.72); box-shadow: 0 0 0 calc(var(--u) * 2) rgba(127, 196, 255, 0.55); text-align: left; white-space: nowrap; }
    .gb-holo .k { font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.18em; font-size: calc(var(--u) * 30); color: #bfe4ff; }
    .gb-holo .v { font-family: var(--book); font-size: calc(var(--u) * 66); font-weight: 600; color: #f2f8ff; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .gb-holo .v small { font-size: 0.5em; opacity: 0.8; }
    .gb-holo .s { font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.12em; font-size: calc(var(--u) * 28); color: #9fe0b8; margin-top: calc(var(--u) * 2); }
    .gb-holo.w { box-shadow: 0 0 0 calc(var(--u) * 2) rgba(255, 180, 107, 0.7); background: rgba(30, 14, 8, 0.55); }
    .gb-holo.w .k { color: #ffd9a8; } .gb-holo.w .s { color: #ffc98a; font-size: calc(var(--u) * 36); }
    .gb-res { position: absolute; transform: translate(-100%, -50%); pointer-events: none; padding: calc(var(--u) * 10) calc(var(--u) * 22); border-radius: calc(var(--u) * 12); background: rgba(14, 8, 24, 0.72);
      font-family: var(--hud-font); font-weight: 600; letter-spacing: 0.12em; font-size: calc(var(--u) * 30); color: #f1e6d6; line-height: 1.7; white-space: nowrap; }
    .gb-res.r { transform: translate(0, -50%); }
    .gb-res b { font-family: var(--book); font-size: 1.5em; letter-spacing: 0; color: #ffd9a8; margin-left: 0.3em; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <!-- Cinematic HUD (built by js/ui/storyHud.js from SCRIPT.hud; stays visible in Recording Mode) -->
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What If Gravity Doubled?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BREWING THE COFFEE…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine (unchanged; this prototype only configures and extends it from its own folder) -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <!-- this page's fog: gentle banks, a low morning haze, capped so silhouettes survive (first call wins) -->
  <script>installFog({ bankScale: 0.03, bankAmount: 0.35, lowHeight: 2.2, lowAmount: 0.6, cap: 0.86 });</script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/camera/viewerHands.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film (plan: films/gravity-doubled-3min/PLAN.md) -->
  <script src="films/gravity-doubled-3min/narration-timing.js"></script>
  <script src="films/gravity-doubled-3min/narration-audio.js"></script>
  <script src="films/gravity-doubled-3min/script.js"></script>
  <script src="films/gravity-doubled-3min/toon.js"></script>
  <script src="films/gravity-doubled-3min/rig.js"></script>
  <script src="films/gravity-doubled-3min/cafe.js"></script>
  <script src="films/gravity-doubled-3min/plaza.js"></script>
  <script src="films/gravity-doubled-3min/set3.js"></script>
  <script src="films/gravity-doubled-3min/car.js"></script>
  <script src="films/gravity-doubled-3min/cast.js"></script>
  <script src="films/gravity-doubled-3min/motion.js"></script>
  <script src="films/gravity-doubled-3min/cast3.js"></script>
  <script src="films/gravity-doubled-3min/holo.js"></script>
  <script src="films/gravity-doubled-3min/drop.js"></script>
  <script src="films/gravity-doubled-3min/shots.js"></script>
  <script src="films/gravity-doubled-3min/post.js"></script>
  <script src="films/gravity-doubled-3min/mix.js"></script>
  <script src="films/gravity-doubled-3min/audio.js"></script>
  <script src="films/gravity-doubled-3min/film.js"></script>
  <script src="films/gravity-doubled-3min/soundtrack.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
