<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Killua and Eren in WWII</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    #hud::before { display: none; }
    #hud > div { position: absolute; }
    /* the title: centred on the screen, three lines; narrow enough to clear the right-hand buttons */
    #hud .xo-title { left: 0; right: 0; top: calc(var(--u) * 790); text-align: center; font-family: 'Oswald', sans-serif; color: #ffffff; text-transform: uppercase;
      text-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 18) rgba(0, 0, 0, 0.8), 0 0 calc(var(--u) * 70) rgba(0, 0, 0, 0.45); }
    #hud .xo-title span { display: block; line-height: 1.02; }
    #hud .xo-title .a { font-weight: 700; font-size: calc(var(--u) * 64); letter-spacing: 0.02em; }
    #hud .xo-title .b { margin-top: calc(var(--u) * 16); font-weight: 500; font-size: calc(var(--u) * 44); letter-spacing: 0.36em; color: #e8dccb; }
    #hud .xo-title .c { margin-top: calc(var(--u) * 12); font-weight: 700; font-size: calc(var(--u) * 106); letter-spacing: 0.03em; }
    /* the few captions mid-film */
    #hud .xo-sub { left: 0; right: 0; top: calc(var(--u) * 1330); text-align: center; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: calc(var(--u) * 54);
      line-height: 1.1; letter-spacing: 0.05em; color: #ffffff; text-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 16) rgba(0, 0, 0, 0.85), 0 0 calc(var(--u) * 40) rgba(0, 0, 0, 0.5); }
    /* the last line, above the bottom safe zone */
    #hud .xo-cap { left: 0; right: 0; top: calc(var(--u) * 1318); text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: calc(var(--u) * 70);
      line-height: 1.08; letter-spacing: 0.06em; color: #ffffff; text-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 20) rgba(0, 0, 0, 0.85), 0 0 calc(var(--u) * 50) rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">Killua and Eren in WWII</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step · add ?safe to the address to see the safe zones</div>
  </div>
  <div id="loading">LOADING THE BATTLEFIELD…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/world/people.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film -->
  <script src="js/world/heroes.js"></script>
  <script src="films/xover/titan.js"></script>
  <script src="films/xover/cast.js"></script>
  <script src="films/xover/tank.js"></script>
  <script src="films/xover/script.js"></script>
  <script src="films/xover/world.js"></script>
  <script src="films/xover/fx.js"></script>
  <script src="films/xover/action.js"></script>
  <script src="films/xover/shots.js"></script>
  <script src="films/xover/audio.js"></script>
  <script src="films/xover/film.js"></script>
  <script src="films/xover/soundtrack.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
