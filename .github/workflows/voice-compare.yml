# Voice comparison: says one line with several ElevenLabs voices, models and quality settings and
# uploads them as one download (loudness-matched WAVs + the original MP3s) so the narrator can be
# picked by ear. Uses the repository secret ELEVENLABS_API_KEY (never printed). See docs/NARRATION.md.
name: Voice comparison

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Which voices: natural (conversational) or narrator (announcer style)"
        type: choice
        options: [natural, narrator]
        default: natural
      text:
        description: "Line to compare (leave empty for the default line)"
        required: false
        default: ""
  push:
    branches: ["feature/elevenlabs-narration-*"]
    paths:
      - ".github/workflows/voice-compare.yml"
      - "tools/voice-compare.cjs"

permissions:
  contents: read

jobs:
  voice-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
          ffmpeg -version | head -1

      - name: Generate the variants
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          COMPARE_TEXT: ${{ inputs.text }}
          COMPARE_SET: ${{ inputs.set || 'natural' }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::The secret ELEVENLABS_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          set -- --out out/voice-comparison --set "$COMPARE_SET" --summary "$GITHUB_STEP_SUMMARY"
          if [ -n "$COMPARE_TEXT" ]; then set -- "$@" --text "$COMPARE_TEXT"; fi
          node tools/voice-compare.cjs "$@"

      - name: Upload the comparison
        uses: actions/upload-artifact@v4
        with:
          name: voice-comparison
          path: out/voice-comparison
          if-no-files-found: error
          retention-days: 14
