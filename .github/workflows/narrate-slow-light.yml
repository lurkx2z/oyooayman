# Narrate "What if light kept getting slower and couldn't stop?" (16:9 long-form): turns films/slow-light/NARRATION.md into one verified MP3
# per clip plus forced-alignment word timestamps (tools/narrate-aligned.cjs), then commits them back to this branch
# so the film can be built around the real audio. Uses the repository secret ELEVENLABS_API_KEY (never printed).
# Same route as the Tesla Roadster films' narration workflows (copied from episode/tesla-flying-roadster-4iom0h).
name: Narrate slow light

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every clip even if its text did not change"
        type: boolean
        default: false
  push:
    branches: ["episode/new-video-idea-*"]
    paths: ["films/slow-light/NARRATION.md", ".github/workflows/narrate-slow-light.yml"]

permissions:
  contents: write

concurrency:
  group: narrate-slow-light-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLUG: slow-light
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg (for the playback check)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
          ffmpeg -version | head -1

      - name: Show the ElevenLabs account's credits (best effort, the key is never printed)
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          node -e '
            fetch("https://api.elevenlabs.io/v1/user/subscription", { headers: { "xi-api-key": process.env.ELEVENLABS_API_KEY } })
              .then(async (r) => {
                const t = await r.text();
                if (!r.ok) { console.log("subscription info unavailable: HTTP " + r.status + " " + t.slice(0, 200)); return; }
                const j = JSON.parse(t), left = j.character_limit - j.character_count;
                const reset = j.next_character_count_reset_unix ? new Date(j.next_character_count_reset_unix * 1000).toISOString() : "?";
                const line = `account plan ${j.tier}: ${j.character_count} of ${j.character_limit} credits used, ${left} left, resets ${reset}`;
                console.log(line);
                if (process.env.GITHUB_STEP_SUMMARY) require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n\n");
              })
              .catch((e) => console.log("subscription info unavailable: " + e.message));'

      - name: Generate, verify and time every clip
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::The secret ELEVENLABS_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node tools/narrate-aligned.cjs --script "films/$SLUG/NARRATION.md" $FORCE
          node tools/narrate-aligned.cjs --script "films/$SLUG/NARRATION.md" --realign --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit the clips back to this branch
        # always: a run that stops halfway (e.g. out of credits) still saves the clips it made, so they are not paid twice
        if: always()
        run: |
          git config user.name "narration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "films/$SLUG/narration"
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "narration: $SLUG clips / word timestamps (ElevenLabs, run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
