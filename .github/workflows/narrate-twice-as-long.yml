# Narrate "What If Every Step You Took Was Twice as Long?" (films/twice-as-long/NARRATION.md): one verified MP3 per clip plus
# forced-alignment word timestamps (tools/narrate-aligned.cjs), committed back to this branch so the film is built around
# the real voice. Uses the repository secret ELEVENLABS_API_KEY (never printed). The cloud container cannot reach
# api.elevenlabs.io, so this runs on GitHub Actions.
name: Narrate twice-as-long

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every clip even if its text did not change"
        type: boolean
        default: false
  push:
    branches: ["claude/project-thread-kcjsx7"]
    paths: ["films/twice-as-long/NARRATION.md", ".github/workflows/narrate-twice-as-long.yml"]

permissions:
  contents: write

concurrency:
  group: narrate-twice-as-long-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLUG: twice-as-long
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg (for the playback check)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
          ffmpeg -version | head -1

      - name: Generate, verify and time every clip
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::The secret ELEVENLABS_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node tools/narrate-aligned.cjs --script "films/$SLUG/NARRATION.md" $FORCE
          node tools/narrate-aligned.cjs --script "films/$SLUG/NARRATION.md" --realign --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit the clips back to this branch
        run: |
          git config user.name "narration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "films/$SLUG/narration"
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "narration: $SLUG clips / word timestamps (ElevenLabs, run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
