# Project Immortal: turns immortal/audio/AUDIO_SPEC.json into designed character voices, dialogue takes (with word
# timestamps), sound effects and music via ElevenLabs, then commits them back to this branch. Uses the repository
# secret ELEVENLABS_API_KEY (never printed). Only entries whose text changed are regenerated.
name: Project Immortal audio

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate everything even if unchanged"
        type: boolean
        default: false
  push:
    branches: ["episode/immortal-*"]
    paths: ["immortal/audio/AUDIO_SPEC.json", ".github/workflows/immortal-audio.yml", "immortal/tools/elevenlabs-assets.cjs"]

permissions:
  contents: write

concurrency:
  group: immortal-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
          ffmpeg -version | head -1

      - name: Generate voices, dialogue, sound effects and music
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::error::The secret ELEVENLABS_API_KEY is missing."; exit 1; fi
          node immortal/tools/elevenlabs-assets.cjs $FORCE --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit the audio back to this branch
        if: always()
        run: |
          git config user.name "immortal-audio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add immortal/audio/generated immortal/audio/voices.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "audio: Project Immortal voices / dialogue / sfx / music (ElevenLabs, run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
