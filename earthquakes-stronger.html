  <style>
    /* this film's HUD (page-level only). 16:9 (1920×1080): --u = one design pixel of a 1920-wide frame (set by film.js).
       The new recipe's minimal text: MAGNITUDE and one giant number, one status word, the minute bar, labels on things.
       Bold sans, no serif. */
    #hud::before { display: none; }
    .eq-count { position: absolute; left: calc(var(--u) * 56); top: calc(var(--u) * 36); pointer-events: none; transform-origin: 0 30%;
      text-shadow: 0 0 calc(var(--u) * 26) rgba(0, 0, 0, 0.55), 0 calc(var(--u) * 4) calc(var(--u) * 14) rgba(0, 0, 0, 0.6); }
    .eq-count .l { font-family: var(--hud-font); font-weight: 800; font-size: calc(var(--u) * 40); letter-spacing: 0.2em; color: #ffffff; opacity: 0.95; }
    .eq-count .v { font-family: var(--hud-font); font-weight: 900; font-size: calc(var(--u) * 190); line-height: 0.88; letter-spacing: -0.03em; color: #ffffff;
      font-variant-numeric: tabular-nums; margin-top: calc(var(--u) * -4); }
    .eq-count.tick .v { color: #ffe04a; }
    .eq-stat { position: absolute; left: calc(var(--u) * 56); top: calc(var(--u) * 268); pointer-events: none; white-space: nowrap;
      font-family: var(--hud-font); font-weight: 900; font-size: calc(var(--u) * 46); letter-spacing: 0.07em; color: #fff;
      padding: calc(var(--u) * 8) calc(var(--u) * 22) calc(var(--u) * 10); border-radius: calc(var(--u) * 12); background: rgba(8, 10, 14, 0.62); }
    .eq-stat.warm { background: #f08a1c; color: #1a0e02; }
    .eq-stat.hot { background: #e8322a; color: #fff; }
    .eq-stat.max { background: #b0101a; color: #fff; box-shadow: 0 0 calc(var(--u) * 26) rgba(255, 40, 30, 0.55); }
    .eq-stat:empty { display: none; }
    /* the minute bar: how far through this minute (the next magnitude when it fills) */
    .eq-bar { position: absolute; left: calc(var(--u) * 58); top: calc(var(--u) * 352); width: calc(var(--u) * 330); pointer-events: none; }
    .eq-bar .t { font-family: var(--hud-font); font-weight: 800; font-size: calc(var(--u) * 25); letter-spacing: 0.14em; color: #fff; opacity: 0.92;
      text-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 8) rgba(0, 0, 0, 0.7); margin-bottom: calc(var(--u) * 6); white-space: nowrap; }
    .eq-bar .tr { height: calc(var(--u) * 10); border-radius: calc(var(--u) * 5); background: rgba(8, 10, 14, 0.55); overflow: hidden; }
    .eq-bar .f { height: 100%; background: #ffe04a; border-radius: calc(var(--u) * 5); }
    /* labels pinned to things: a ring on the thing, a bold caps name on a plate, a small amber line under it */
    .eq-lab { position: absolute; transform: translate(calc(var(--u) * -20), -50%); pointer-events: none; white-space: nowrap; }
    .eq-lab .t { display: inline-block; vertical-align: middle; padding: calc(var(--u) * 8) calc(var(--u) * 18) calc(var(--u) * 9); border-radius: calc(var(--u) * 10);
      background: rgba(6, 8, 12, 0.72); font-family: var(--hud-font); font-weight: 800; font-size: calc(var(--u) * 38); letter-spacing: 0.05em; color: #fff; line-height: 1.05; }
    .eq-lab small { display: block; font-weight: 700; font-size: 0.68em; letter-spacing: 0.08em; color: #ffd36a; margin-top: calc(var(--u) * 3); }
    .eq-lab .d { display: inline-block; vertical-align: middle; width: calc(var(--u) * 34); height: calc(var(--u) * 34); border-radius: 50%; margin-right: calc(var(--u) * 10);
      box-shadow: 0 0 0 calc(var(--u) * 4) #ffd36a, 0 0 calc(var(--u) * 12) rgba(0, 0, 0, 0.6); }
    .eq-lab.r { transform: translate(calc(-100% + var(--u) * 20), -50%); text-align: right; }
    .eq-lab.r .d { margin-right: 0; margin-left: calc(var(--u) * 10); }
    .eq-lab.you .t { background: #ff6a1f; }
    .eq-lab.you .d { box-shadow: 0 0 0 calc(var(--u) * 4) #ff6a1f, 0 0 calc(var(--u) * 12) rgba(0, 0, 0, 0.6); }
    .eq-lab.quake .t { background: #c81e1e; }
    .eq-lab.quake .d { box-shadow: 0 0 0 calc(var(--u) * 4) #ff4030, 0 0 calc(var(--u) * 12) rgba(0, 0, 0, 0.6); }
    /* the honest tag (bottom left, small) */
    .eq-tag { position: absolute; left: calc(var(--u) * 56); bottom: calc(var(--u) * 36); white-space: pre; line-height: 1.35; font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 27); letter-spacing: 0.1em;
      color: #f0ece4; padding: calc(var(--u) * 7) calc(var(--u) * 16); border-radius: calc(var(--u) * 8); background: rgba(6, 8, 12, 0.62); pointer-events: none; }
    /* diagrams (SVG, drawn per frame) */
    .eq-dia { position: absolute; inset: 0; pointer-events: none; }
    .eq-dia svg { width: 100%; height: 100%; display: block; }
    .eq-dia .b { font-family: var(--hud-font); font-weight: 900; fill: #fff; letter-spacing: 0.03em; }
    .eq-dia .s { font-family: var(--hud-font); font-weight: 700; fill: #ffd36a; letter-spacing: 0.06em; }
    .eq-dia .w { font-family: var(--hud-font); font-weight: 700; fill: #f0ece4; letter-spacing: 0.05em; }
  </style>
