    #hud .story-title.big.center { top: calc(var(--u) * 330); width: calc(var(--u) * 1400); margin-left: calc(var(--u) * -700); }

    .lb-cap { position: absolute; left: 50%; bottom: calc(var(--u) * 92); transform: translateX(-50%); width: max-content; max-width: calc(var(--u) * 1500); text-align: center;

    .lb-ro .v small { font-size: 0.5em; opacity: 0.85; }
    .lb-ro .v { font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 78); line-height: 1.05; margin-top: calc(var(--u) * 4); color: var(--paper);

    .lb-ctx { position: absolute; left: calc(var(--u) * 52); top: calc(var(--u) * 312); pointer-events: none; padding: calc(var(--u) * 12) calc(var(--u) * 26) calc(var(--u) * 14); border-radius: calc(var(--u) * 14);

    .lb-ctx .l { display: block; font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 24); letter-spacing: 0.16em; color: #fff; opacity: 0.8; }

    .lb-inset .s { font-family: var(--hud-font); font-weight: 600; font-size: 21px; letter-spacing: 0.12em; fill: #ffd7a8; }
    .lb-inset .b { font-family: var(--hud-font); font-weight: 600; font-size: 22px; fill: #fff; }
    /* labels pinned to places */
    .lb-lab { position: absolute; transform: translate(calc(var(--u) * -14), -50%); pointer-events: none; white-space: nowrap; font-family: var(--hud-font); font-weight: 600;
      font-size: calc(var(--u) * 34); letter-spacing: 0.08em; color: #f6efe2;
      text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, 0.9); }
    /* (the plate sits behind the words only: the ring stays clear, so you see the thing it points at inside it) */
    .lb-lab .t { display: inline-block; vertical-align: middle; padding: calc(var(--u) * 6) calc(var(--u) * 14); border-radius: calc(var(--u) * 10); background: rgba(4, 6, 10, 0.55); }
