<head>

  <link rel="stylesheet" href="style.css">
  <style>
    /* this film's HUD styling (page-level only: never edit the shared story classes in style.css for one film) */
    #hud .story-title.big.center { top: calc(var(--u) * 760); width: calc(var(--u) * 1000); margin-left: calc(var(--u) * -500); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(4, 6, 8, 0.5), rgba(4, 6, 8, 0.2) 62%, rgba(4, 6, 8, 0)); }
    #hud .story-title.big.center .kick { font-family: var(--book); font-size: calc(var(--u) * 58); font-weight: 600; letter-spacing: 0.04em; }
    #hud .story-title.big.center .hero { font-family: var(--book); font-size: calc(var(--u) * 96); font-weight: 700; line-height: 1.08; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 28) rgba(0, 0, 0, 0.75), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* captions: one short line, on a dark plate, inside the safe zone (left of the right-hand button rail) */
    #hud .story-caption { top: calc(var(--u) * 1320); left: 45%; font-family: var(--book); font-size: calc(var(--u) * 58); font-weight: 600; line-height: 1.2;
      padding: calc(var(--u) * 14) calc(var(--u) * 30); border-radius: calc(var(--u) * 14); background: rgba(4, 6, 9, 0.62); max-width: calc(var(--u) * 790); width: max-content; }
    /* the top-left readout: big enough for a phone */
    #hud .story-readout { left: calc(var(--u) * 44); padding: calc(var(--u) * 14) calc(var(--u) * 24); border-radius: calc(var(--u) * 14); background: rgba(4, 6, 10, 0.4); }
    #hud .story-readout .label { font-size: calc(var(--u) * 28); letter-spacing: 0.16em; opacity: 0.92; color: #ffffff; }
    #hud .story-readout .value { font-size: calc(var(--u) * 88); margin-top: calc(var(--u) * 6); }
    #hud .story-readout .sub { font-family: var(--hud-font); font-size: calc(var(--u) * 26); letter-spacing: 0.12em; opacity: 0.9; margin-top: calc(var(--u) * 8); color: #ffd7a8; }
    #hud .story-end { top: calc(var(--u) * 820); font-size: calc(var(--u) * 66); }
    /* the two closing lines (SCRIPT.hud.stack), on a soft dark plate */
    #hud .story-stack { top: calc(var(--u) * 780); width: calc(var(--u) * 920); }
    #hud .story-stack .line { position: relative; }
    #hud .story-stack .line::before { content: ''; position: absolute; left: -8%; right: -8%; top: -35%; bottom: -35%; z-index: -1;
      background: radial-gradient(closest-side, rgba(4, 6, 8, 0.62), rgba(4, 6, 8, 0.3) 62%, rgba(4, 6, 8, 0)); }
    #hud .story-stack .line { font-size: calc(var(--u) * 64); font-weight: 600; line-height: 1.22; margin-bottom: calc(var(--u) * 26);
      text-shadow: 0 0 calc(var(--u) * 24) rgba(0, 0, 0, 0.7), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0, 0, 0, 0.6); }
    #hud .story-stack .line:first-child { font-style: italic; font-weight: 600; font-size: calc(var(--u) * 60); }
    #hud .story-note { top: calc(var(--u) * 1420); font-family: var(--hud-font); font-size: calc(var(--u) * 26); letter-spacing: 0.12em; padding: calc(var(--u) * 10) calc(var(--u) * 18);
      border-radius: calc(var(--u) * 12); background: rgba(4, 6, 10, 0.45); width: calc(var(--u) * 640); line-height: 1.45; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <!-- Cinematic HUD (built by js/ui/storyHud.js from SCRIPT.hud; stays visible in Recording Mode) -->
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">WHAT IF GRAVITY BECAME TWICE AS STRONG?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BUILDING THE STREET…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>

  <script src="js/main.js"></script>
