<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHAT IF EVERYTHING LOST ITS ELASTICITY?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film's HUD styling (page-level only: never edit the shared story classes in style.css for one film) */
    #hud .story-title.big.center { top: calc(var(--u) * 760); width: calc(var(--u) * 1000); margin-left: calc(var(--u) * -500); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(4, 6, 8, 0.5), rgba(4, 6, 8, 0.2) 62%, rgba(4, 6, 8, 0)); }
    #hud .story-title.big.center .kick { font-family: var(--book); font-size: calc(var(--u) * 58); font-weight: 600; letter-spacing: 0.04em; }
    #hud .story-title.big.center .hero { font-family: var(--book); font-size: calc(var(--u) * 96); font-weight: 700; line-height: 1.08; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 28) rgba(0, 0, 0, 0.75), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* captions: one short line, on a dark plate, inside the safe zone (left of the right-hand button rail) */
    #hud .story-caption { top: calc(var(--u) * 1320); left: 45%; font-family: var(--book); font-size: calc(var(--u) * 58); font-weight: 600; line-height: 1.2;
      padding: calc(var(--u) * 14) calc(var(--u) * 30); border-radius: calc(var(--u) * 14); background: rgba(4, 6, 9, 0.62); max-width: calc(var(--u) * 790); width: max-content; }
    /* the top-left readout: big enough for a phone */
    #hud .story-readout { left: calc(var(--u) * 44); padding: calc(var(--u) * 14) calc(var(--u) * 24); border-radius: calc(var(--u) * 14); background: rgba(4, 6, 10, 0.4); }
    #hud .story-readout .label { font-size: calc(var(--u) * 28); letter-spacing: 0.16em; opacity: 0.92; color: #ffffff; }
    #hud .story-readout .value { font-size: calc(var(--u) * 88); margin-top: calc(var(--u) * 6); }
    #hud .story-readout .sub { font-family: var(--hud-font); font-size: calc(var(--u) * 26); letter-spacing: 0.12em; opacity: 0.9; margin-top: calc(var(--u) * 8); color: #ffd7a8; }
    /* the montage label: what you're looking at, and what happened to it */
    #hud .ne-chyron { position: absolute; left: 50%; top: calc(var(--u) * 330); transform: translateX(-50%); text-align: center; width: calc(var(--u) * 900);
      background: rgba(6, 7, 10, 0.42); padding: calc(var(--u) * 18) 0; border-radius: calc(var(--u) * 22); }
    #hud .ne-chyron .mt { display: block; font-family: var(--book); font-size: calc(var(--u) * 72); font-weight: 600; letter-spacing: 0.05em; text-shadow: 0 0 calc(var(--u) * 20) rgba(0, 0, 0, 0.8); }
    #hud .ne-chyron .mr { display: block; font-family: var(--book); font-style: italic; font-size: calc(var(--u) * 44); margin-top: calc(var(--u) * 10); opacity: 0.95; text-shadow: 0 0 calc(var(--u) * 14) rgba(0, 0, 0, 0.9); }
    /* a label pinned to something in the world, with a tick down to it */
    #hud .ne-tag { position: absolute; transform: translate(-50%, calc(-100% - var(--u) * 26)); white-space: nowrap; font-family: var(--hud-font); font-size: calc(var(--u) * 32);
      letter-spacing: 0.08em; color: #fff; background: rgba(200, 40, 30, 0.84); padding: calc(var(--u) * 8) calc(var(--u) * 16); border-radius: calc(var(--u) * 10); }
    #hud .ne-tag::after { content: ''; position: absolute; left: 50%; top: 100%; width: calc(var(--u) * 3); height: calc(var(--u) * 26); background: rgba(255, 255, 255, 0.85); transform: translateX(-50%); }
    #hud .ne-tag.line { background: rgba(30, 26, 6, 0.78); color: #ffd23e; }
    #hud .ne-tag.line::after { background: #ffd23e; }
    #hud .story-end { top: calc(var(--u) * 820); font-size: calc(var(--u) * 66); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <!-- Cinematic HUD (built by js/ui/storyHud.js from SCRIPT.hud; stays visible in Recording Mode) -->
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">WHAT IF EVERYTHING LOST ITS ELASTICITY?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BUILDING THE STREET…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine (don't edit these files for one film — see docs/LOCKED_SYSTEMS.md) -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/camera/viewerHands.js"></script>
  <script src="js/world/people.js"></script>
  <script src="js/world/vehicles.js"></script>
  <script src="js/world/environment.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film (plan: films/no-elasticity/PLAN.md) -->
  <script src="films/no-elasticity/script.js"></script>
  <script src="films/no-elasticity/city.js"></script>
  <script src="films/no-elasticity/props.js"></script>
  <script src="films/no-elasticity/cars.js"></script>
  <script src="films/no-elasticity/cast.js"></script>
  <script src="films/no-elasticity/audio.js"></script>
  <script src="films/no-elasticity/film.js"></script>
  <script src="films/no-elasticity/soundtrack.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
