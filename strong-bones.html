<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What if you were 10× stronger, but your bones weren’t?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film's HUD (page-level only). 16:9 (1920×1080): --u = one design pixel of a 1920-wide frame (set by film.js) */
    #hud .story-title, #hud .story-caption { display: none; }
    .sb-title { position: absolute; left: 50%; top: calc(var(--u) * 300); transform: translateX(-50%); width: calc(var(--u) * 1500); text-align: center; pointer-events: none;
      color: #f6f1e7; text-shadow: 0 0 calc(var(--u) * 40) rgba(0, 0, 0, 0.85), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.75); }
    .sb-title::before { content: ''; position: absolute; left: -10%; right: -10%; top: -40%; bottom: -40%; z-index: -1; background: radial-gradient(closest-side, rgba(2, 3, 6, 0.6), rgba(2, 3, 6, 0.25) 60%, rgba(2, 3, 6, 0)); }
    .sb-title .k { display: block; font-family: var(--book); font-weight: 600; font-size: calc(var(--u) * 56); letter-spacing: 0.08em; }
    .sb-title .h { display: block; font-family: var(--book); font-weight: 700; font-size: calc(var(--u) * 132); line-height: 1.02; letter-spacing: 0.02em; }
    .sb-title .k2 { display: block; font-family: var(--book); font-weight: 600; font-size: calc(var(--u) * 62); letter-spacing: 0.04em; color: #ffcf8a; margin-top: calc(var(--u) * 8); }
    .sb-band { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 300); pointer-events: none; background: linear-gradient(to top, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.28) 45%, rgba(0, 0, 0, 0)); }
    .sb-cap { position: absolute; left: 50%; bottom: calc(var(--u) * 84); transform: translateX(-50%); width: max-content; max-width: calc(var(--u) * 1500); text-align: center; text-wrap: balance; pointer-events: none;
      font-family: var(--book); font-weight: 600; font-size: calc(var(--u) * 56); line-height: 1.2; color: #f6f1e7;
      text-shadow: 0 0 calc(var(--u) * 18) rgba(0, 0, 0, 0.85), 0 0 calc(var(--u) * 4) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 2) calc(var(--u) * 10) rgba(0, 0, 0, 0.7); }
    .sb-cap .n { color: #ffcf8a; }
    .sb-cap.sis { font-style: italic; color: #ffe08a; }
    .sb-cap.sis::before { content: ''; display: inline-block; width: calc(var(--u) * 22); height: calc(var(--u) * 22); border-radius: 50%; background: #f2c230; margin-right: calc(var(--u) * 16); vertical-align: 0.1em;
      box-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.6); }
    .sb-cap.q { bottom: calc(var(--u) * 120); font-size: calc(var(--u) * 92); }
    .sb-ro { position: absolute; left: calc(var(--u) * 52); top: calc(var(--u) * 44); padding: calc(var(--u) * 16) calc(var(--u) * 28) calc(var(--u) * 18); border-radius: calc(var(--u) * 16);
      background: rgba(6, 8, 12, 0.58); pointer-events: none; text-shadow: 0 0 calc(var(--u) * 14) rgba(0, 0, 0, 0.75); }
    .sb-ro .l { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 26); letter-spacing: 0.18em; color: #fff; opacity: 0.9; }
    .sb-ro .v { font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 84); line-height: 1.05; margin-top: calc(var(--u) * 4); color: #fff; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
    .sb-ro .v small { font-size: 0.5em; opacity: 0.85; }
    .sb-ro .s { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 27); letter-spacing: 0.1em; margin-top: calc(var(--u) * 6); color: #ffd7a8; white-space: nowrap; }
    .sb-ro .s:empty { display: none; }
    .sb-tag { position: absolute; left: calc(var(--u) * 52); top: calc(var(--u) * 44); max-width: calc(var(--u) * 760); font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 27); line-height: 1.35; letter-spacing: 0.06em;
      color: #e9e2d4; padding: calc(var(--u) * 12) calc(var(--u) * 20); border-radius: calc(var(--u) * 10); background: rgba(6, 8, 12, 0.6); pointer-events: none; }
    .sb-tag b { color: #ffcf8a; letter-spacing: 0.14em; }
    .sb-lab { position: absolute; transform: translate(calc(var(--u) * -14), -50%); pointer-events: none; white-space: nowrap; font-family: var(--hud-font); font-weight: 600;
      font-size: calc(var(--u) * 34); letter-spacing: 0.08em; color: #f6efe2; text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    .sb-lab .t { display: inline-block; vertical-align: middle; padding: calc(var(--u) * 6) calc(var(--u) * 14); border-radius: calc(var(--u) * 10); background: rgba(4, 6, 10, 0.6); }
    .sb-lab .t small { display: block; font-size: 0.72em; color: #ffd7a8; }
    .sb-lab .d { display: inline-block; width: calc(var(--u) * 28); height: calc(var(--u) * 28); border-radius: 50%; margin-right: calc(var(--u) * 8); box-shadow: 0 0 0 calc(var(--u) * 3) rgba(255, 215, 168, 0.9); vertical-align: middle; }
    .sb-lab.y .d { box-shadow: 0 0 0 calc(var(--u) * 3) #f2c230; }
    .sb-lab.r { transform: translate(calc(-100% + var(--u) * 14), -50%); }
    .sb-lab.r .d { margin-right: 0; margin-left: calc(var(--u) * 8); }
    .sb-inset { position: absolute; right: calc(var(--u) * 70); top: calc(var(--u) * 150); width: calc(var(--u) * 760); height: calc(var(--u) * 560); pointer-events: none; }
    .sb-inset svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .sb-inset .t { font-family: var(--hud-font); font-weight: 700; font-size: 34px; letter-spacing: 0.1em; fill: #f6efe2; }
    .sb-inset .s { font-family: var(--hud-font); font-weight: 600; font-size: 30px; letter-spacing: 0.08em; fill: #ffd7a8; }
    .sb-inset .big { font-family: var(--book); font-weight: 700; font-size: 70px; fill: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
    </div>
  </div>
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What if you were 10× stronger, but your bones weren’t?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BUILDING THE KITCHEN AND THE ARENA…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine (unchanged; this film only configures and extends it from its own folder) -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script>installFog({ bankScale: 0.012, bankAmount: 0.0, lowHeight: 6, lowAmount: 0.0, cap: 0.85 });</script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/fx/mirror.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/camera/viewerHands.js"></script>
  <script src="js/world/people.js"></script>
  <script src="js/world/vehicles.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film (plan: films/strong-bones/PLAN.md; voice: films/strong-bones/NARRATION.md) -->
  <script src="films/strong-bones/timing.js"></script>
  <script src="films/strong-bones/script.js"></script>
  <script src="films/strong-bones/kit.js"></script>
  <script src="films/strong-bones/kitchen.js"></script>
  <script src="films/strong-bones/arena.js"></script>
  <script src="films/strong-bones/film.js"></script>
  <script src="films/strong-bones/hud.js"></script>
  <script src="films/strong-bones/audio.js"></script>
  <script src="films/strong-bones/soundtrack.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
