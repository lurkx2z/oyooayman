<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What If Andromeda Collided With the Milky Way Overnight?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film: the question in the middle of the night sky, three lines; the middle one as large as fits */
    #hud .story-title.big.center { top: calc(var(--u) * 560); width: calc(var(--u) * 1040); margin-left: calc(var(--u) * -520); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(3, 5, 10, 0.5), rgba(3, 5, 10, 0.2) 62%, rgba(3, 5, 10, 0)); }
    #hud .story-title.big.center .kick { font-size: calc(var(--u) * 58); letter-spacing: 0.1em; }
    #hud .story-title.big.center .hero { font-size: calc(var(--u) * 70); font-weight: 700; white-space: nowrap; letter-spacing: 0.005em; margin: calc(var(--u) * 14) 0; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 24) rgba(0, 0, 0, 0.75), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* captions low in the frame on a soft scrim */
    #hud .story-caption { top: calc(var(--u) * 1330); font-size: calc(var(--u) * 54); font-weight: 600; padding: calc(var(--u) * 14) calc(var(--u) * 30); border-radius: calc(var(--u) * 18);
      background: rgba(4, 6, 10, 0.45); text-shadow: 0 0 calc(var(--u) * 16) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0, 0, 0, 0.8); }
    /* the HUD: readable on a phone, a dark halo behind it */
    #hud .story-readout { left: calc(var(--u) * 40); padding: calc(var(--u) * 14) calc(var(--u) * 24); border-radius: calc(var(--u) * 20); background: rgba(4, 6, 12, 0.36); }
    #hud .story-readout .label { font-size: calc(var(--u) * 36); letter-spacing: 0.14em; opacity: 0.95; color: #ffffff; text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    #hud .story-readout .value { font-size: calc(var(--u) * 96); margin-top: calc(var(--u) * 4); text-shadow: 0 0 calc(var(--u) * 18) rgba(0, 0, 0, 0.75); }
    #hud .story-readout .sub { font-family: var(--hud-font); font-size: calc(var(--u) * 34); letter-spacing: 0.08em; opacity: 0.95; margin-top: calc(var(--u) * 6); text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    #hud .story-readout .ctx { font-size: calc(var(--u) * 26); letter-spacing: 0.16em; opacity: 0.88; color: #bcd2ff; margin-top: calc(var(--u) * 12); text-shadow: 0 0 calc(var(--u) * 10) rgba(0, 0, 0, 0.9); }
    /* the end card: the real timescale against ours */
    #hud .am-card { position: absolute; left: 50%; top: calc(var(--u) * 760); transform: translateX(-50%); width: calc(var(--u) * 940); text-align: center;
      padding: calc(var(--u) * 40) 0; border-radius: calc(var(--u) * 26); background: rgba(3, 4, 8, 0.62); }
    #hud .am-card .row { margin: calc(var(--u) * 18) 0; }
    #hud .am-card .k { display: block; font-family: var(--hud-font); font-size: calc(var(--u) * 34); letter-spacing: 0.2em; opacity: 0.85; color: #bcd2ff; }
    #hud .am-card .v { display: block; font-family: var(--book); font-size: calc(var(--u) * 76); font-weight: 700; letter-spacing: 0.03em; margin-top: calc(var(--u) * 8); color: #fff;
      text-shadow: 0 0 calc(var(--u) * 20) rgba(0, 0, 0, 0.8); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <!-- Cinematic HUD (built by js/ui/storyHud.js from SCRIPT.hud; stays visible in Recording Mode) -->
      <div id="hud"></div>
    </div>
  </div>

  <!-- Developer controls (hidden in Recording Mode) -->
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What if Andromeda collided with the Milky Way overnight?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">SIMULATING TWO GALAXIES…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <!-- Three.js (bundled locally — no internet or server needed) -->
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine -->
  <script src="js/config.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/textures.js"></script>
  <script src="js/core/geo.js"></script>
  <script src="js/fx/fog.js"></script>
  <script src="js/fx/postprocessing.js"></script>
  <script src="js/fx/look.js"></script>
  <script src="js/fx/particles.js"></script>
  <script src="js/camera/cameraController.js"></script>
  <script src="js/camera/viewerHands.js"></script>
  <script src="js/world/people.js"></script>
  <script src="js/world/vehicles.js"></script>
  <script src="js/world/environment.js"></script>
  <script src="js/audio/audioEngine.js"></script>
  <script src="js/ui/storyHud.js"></script>
  <script src="js/ui/devControls.js"></script>
  <!-- this film (shot plan: films/andromeda/PLAN.md): the simulation and the sky first, then the script, then the world -->
  <script src="films/andromeda/merger.js"></script>
  <script src="films/andromeda/sky.js"></script>
  <script src="films/andromeda/script.js"></script>
  <script src="films/andromeda/overlook.js"></script>
  <script src="films/andromeda/cast.js"></script>
  <script src="films/andromeda/audio.js"></script>
  <script src="films/andromeda/film.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
