<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What if you kept shrinking and couldn't stop?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this film's HUD (page-level only). 16:9 (1920×1080): --u = one design pixel of a 1920-wide frame (set by film.js) */
    #hud::before { height: 26%; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0)); }
    #hud .story-title.big.center { top: calc(var(--u) * 330); width: calc(var(--u) * 1300); margin-left: calc(var(--u) * -650); }
    #hud .story-title.big.center::before { background: radial-gradient(closest-side, rgba(2, 3, 6, 0.5), rgba(2, 3, 6, 0.2) 62%, rgba(2, 3, 6, 0)); }
    #hud .story-title.big.center .kick { font-family: var(--book); font-size: calc(var(--u) * 52); font-weight: 600; letter-spacing: 0.06em; }
    #hud .story-title.big.center .hero { font-family: var(--book); font-size: calc(var(--u) * 132); font-weight: 700; line-height: 1.02; letter-spacing: 0.02em; }
    #hud .story-title.big.center .main { text-shadow: 0 0 calc(var(--u) * 30) rgba(0, 0, 0, 0.8), 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.7); }
    /* the caption: one line, low, on a soft shadow (no plate) */
    .sh-cap { position: absolute; left: 50%; bottom: calc(var(--u) * 92); transform: translateX(-50%); width: max-content; max-width: calc(var(--u) * 1500); text-align: center;
      font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 50); line-height: 1.2; color: #f6f1e7; pointer-events: none;
      text-shadow: 0 0 calc(var(--u) * 18) rgba(0, 0, 0, 0.85), 0 0 calc(var(--u) * 4) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 2) calc(var(--u) * 10) rgba(0, 0, 0, 0.7); }
    .sh-cap::before { content: ''; position: absolute; left: -14%; right: -14%; top: -55%; bottom: -55%; z-index: -1;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0)); }
    /* the readouts (top left: your height; top right: your bedroom, to you) */
    .sh-ro, .sh-room { position: absolute; top: calc(var(--u) * 58); pointer-events: none; text-shadow: 0 0 calc(var(--u) * 14) rgba(0, 0, 0, 0.75), 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, 0.6); }
    .sh-ro { left: calc(var(--u) * 70); }
    .sh-room { right: calc(var(--u) * 70); text-align: right; }
    .sh-ro .l, .sh-room .l { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 21); letter-spacing: 0.2em; color: #ffffff; opacity: 0.9; }
    .sh-ro .v, .sh-room .v { font-family: var(--book); font-weight: 500; font-size: calc(var(--u) * 76); line-height: 1.05; margin-top: calc(var(--u) * 4); color: var(--paper);
      font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
    .sh-room .v { font-size: calc(var(--u) * 58); }
    .sh-ro .s, .sh-room .s { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 19); letter-spacing: 0.15em; margin-top: calc(var(--u) * 6); color: #ffd7a8; }
    .sh-ro .nx { margin-top: calc(var(--u) * 18); padding-top: calc(var(--u) * 12); border-top: calc(var(--u) * 1.5) solid rgba(255, 255, 255, 0.28); width: max-content; min-width: calc(var(--u) * 300); }
    .sh-ro .nx .nl { font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 17); letter-spacing: 0.2em; opacity: 0.7; margin-right: calc(var(--u) * 14); color: #fff; }
    .sh-ro .nx .nn { font-family: var(--hud-font); font-weight: 700; font-size: calc(var(--u) * 17); letter-spacing: 0.16em; color: #fff; }
    .sh-ro .nx .nv { display: block; font-family: var(--book); font-size: calc(var(--u) * 32); margin-top: calc(var(--u) * 4); color: var(--paper); font-variant-numeric: lining-nums tabular-nums; }
    /* the honest label */
    .sh-tag { position: absolute; left: calc(var(--u) * 70); top: calc(var(--u) * 300); font-family: var(--hud-font); font-weight: 600; font-size: calc(var(--u) * 16); letter-spacing: 0.18em;
      color: #e9e2d4; padding: calc(var(--u) * 7) calc(var(--u) * 14); border-radius: calc(var(--u) * 8); background: rgba(6, 8, 12, 0.55); pointer-events: none; }
    /* Mum's notification (top centre, like a phone's banner) */
    .sh-msg { position: absolute; left: 50%; top: calc(var(--u) * 40); transform: translate(-50%, 0); width: calc(var(--u) * 560); display: flex; gap: calc(var(--u) * 18); align-items: center;
      padding: calc(var(--u) * 18) calc(var(--u) * 22); border-radius: calc(var(--u) * 26); background: rgba(38, 40, 46, 0.82); box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 40) rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px); pointer-events: none; }
    .sh-msg .ic { flex: none; width: calc(var(--u) * 64); height: calc(var(--u) * 64); border-radius: calc(var(--u) * 15); background: linear-gradient(#6ee36a, #2fbf3a); position: relative; }
    .sh-msg .ic::after { content: ''; position: absolute; left: 22%; top: 24%; width: 56%; height: 44%; border-radius: 50%; background: #fff; }
    .sh-msg .tx { flex: 1; color: #f2f2f4; font-family: var(--hud-font); }
    .sh-msg .hd { display: flex; justify-content: space-between; font-size: calc(var(--u) * 17); letter-spacing: 0.08em; opacity: 0.72; }
    .sh-msg .hd b { font-weight: 600; }
    .sh-msg .who { font-size: calc(var(--u) * 26); font-weight: 700; margin-top: calc(var(--u) * 4); }
    .sh-msg .body { font-size: calc(var(--u) * 26); font-weight: 400; margin-top: calc(var(--u) * 2); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
    </div>
  </div>
  <div id="dev">
    <button id="bPlay" title="Space">▶ PLAY</button>
    <button id="bRestart" title="R">⟲ RESTART</button>
    <div id="scrubWrap"><div id="markers"></div><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"></div>
    <span id="time">00:00.00 · f0</span>
    <span id="fps">-- fps</span>
    <button id="bMute" title="M">🔊 SOUND</button>
    <button id="bDebug" title="D">DEBUG</button>
    <button id="bRec" title="H">● RECORDING MODE</button>
    <button id="bFull" title="F">⛶ FULL</button>
    <button id="bWav" title="Export the synced soundtrack as a WAV file">⤓ WAV</button>
  </div>
  <div id="debug"></div>
  <div id="startOverlay">
    <div class="big">What if you kept shrinking and couldn't stop?</div>
    <div>CLICK OR PRESS SPACE TO PLAY (ENABLES SOUND)</div>
    <div id="soundStatus" style="opacity:.75"></div>
    <div style="opacity:.6">R restart · D debug · H recording mode · F fullscreen · M mute · ←/→ step</div>
  </div>
  <div id="loading">BUILDING THE BEDROOM…</div>
  <div id="errorBox"></div>

  <script>
    window.addEventListener('error', (e) => {
      const b = document.getElementById('errorBox');
      b.style.display = 'block';
      b.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
    });
  </script>
  <script src="lib/three.bundle.min.js"></script>
  <!-- shared engine (unchanged; this film only configures and extends it from its own folder) -->
