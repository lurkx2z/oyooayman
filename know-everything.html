<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What if you suddenly knew everything?</title>
  <!-- fonts ship with the project (SIL OFL 1.1, see fonts/OFL.txt): works offline and from file:// -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: Inter, sans-serif; overflow: hidden; }
    #wrap { position: absolute; inset: 0 0 48px 0; display: flex; align-items: center; justify-content: center; }
    #c { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #0b0b0f; font-size: 13px; }
    #scrub { flex: 1; }
    #startOverlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,0.72); cursor: pointer; text-align: center; letter-spacing: 0.08em; }
    #startOverlay .big { font-family: Lora, serif; font-size: 34px; letter-spacing: 0; }
    body.capture #bar, body.capture #startOverlay { display: none; }
    body.capture #wrap { inset: 0; }
    body.capture #c { width: 100vw; height: 100vh; max-width: none; max-height: none; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="bar"><span>SPACE play/pause · R restart · ←/→ step · M mute · F full</span><input id="scrub" type="range" min="0" max="400" step="0.0333" value="0"></div>
  <div id="startOverlay"><div class="big">What if you suddenly knew everything?</div><div>CLICK OR PRESS SPACE TO PLAY (WITH SOUND)</div></div>
  <audio id="snd" preload="auto"></audio>
  <script>if (/capture/.test(location.search)) document.body.classList.add('capture');</script>
  <!-- the film (plan: films/know-everything/PLAN.md; voices: films/know-everything/VO-*.md) -->
  <script src="films/know-everything/timing.js"></script>
  <script src="films/know-everything/core.js"></script>
  <script src="films/know-everything/rig.js"></script>
  <script src="films/know-everything/props.js"></script>
  <script src="films/know-everything/world.js"></script>
  <script src="films/know-everything/items.js"></script>
  <script src="films/know-everything/shots.js"></script>
  <script src="films/know-everything/hud.js"></script>
  <script src="films/know-everything/soundtrack.js"></script>
</body>
</html>
